# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python lint

# Perform the various lint checks. FWIW, this is the same as doing a `make lint`, mostly by design.
# If I was cleverer I would have this do the same thing, and have the official lint do a `make lint`
# so that there's no risk of divergence. I'm not that clever, and would rather be more explicit.

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint_and_test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PYTHON_VER
        python-version: ["3.10", "3.11", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
    - name: Lint
      run: |
        # stop the build if there are Python syntax errors or undefined names
        isort --sp pyproject.toml -c pywebpush
        black --quiet --diff --config pyproject.toml --check pywebpush
        bandit --quiet -c pyproject.toml pywebpush
    - name: Test with pytest
      run: |
        pytest pywebpush
