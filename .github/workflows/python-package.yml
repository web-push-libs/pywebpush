# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package
run-name: Package and Publish

on:
  workflow_run:
    workflows:
      - "Python lint"
    types:
      - completed
    branches:
      - main

jobs:
  release-build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && !startsWith(github.ref_name, 'docs?/') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload distributions
        # Make sure the artifact versions match
        uses: actions/upload-artifact@v4
        with:
          # Name of the distribution (no idea why they don't make this clear)
          name: pywebpush
          path: dist/

  pypi-publish:
    # Remember, matching strings need to be in single quotes.
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    runs-on: ubuntu-latest
    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi-publish
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/p/pywebpush

    steps:
      - name: Pull release distributions
        # Make sure the artifact versions match
        uses: actions/download-artifact@v8
        with:
          # Name of the distribution (no idea why they don't make this clear)
          name: pywebpush
          path: dist/
      - name: validate build
        run: |
          ls -aFl dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
